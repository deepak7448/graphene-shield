[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphene-shield"
dynamic = ["version"]
description = "Batteries for Graphene-Django APIs: structured mutation responses, filterable/countable connections, sorting & search, file-upload validation and JWT guards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "deepak prajapati" }]
keywords = ["django", "graphene", "graphql", "relay", "pagination", "mutations", "jwt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
    "graphene>=3.3,<4",
    "graphene-django>=3.2,<4",
    "graphql-relay>=3.2,<4",
]

[project.optional-dependencies]
# Query optimisation for connection fields (graphene-django-optimizer).
optimizer = ["graphene-django-optimizer>=0.10"]
# Multipart file uploads through GraphQLView (graphene-file-upload).
upload = ["graphene-file-upload>=1.3"]
# Stronger file validation: libmagic MIME sniffing (needs the system libmagic library)
# and real PDF object parsing for the active-content check.
files = ["python-magic>=0.4.27", "pypdf[crypto]>=4.0"]
# JWT guards for resolvers and mutations.
jwt = ["PyJWT>=2.8"]
all = [
    "graphene-django-optimizer>=0.10",
    "graphene-file-upload>=1.3",
    "python-magic>=0.4.27",
    "pypdf[crypto]>=4.0",
    "PyJWT>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "build>=1.2",
    "twine>=5",
    "ruff>=0.6",
]

[project.urls]
Changelog = "https://github.com/your-org/graphene-shield/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/graphene_shield/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/graphene_shield"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# README/CHANGELOG code blocks are aligned by hand for readability.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
